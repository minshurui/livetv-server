name: Live Playback Smoke Test

on:
  workflow_call:
    inputs:
      huya_room_id:
        required: false
        type: string
        default: ""
      duration:
        required: false
        type: string
        default: "60"
  workflow_dispatch:
    inputs:
      huya_room_id:
        description: 指定虎牙房间号；留空则从当前直播列表自动选择
        required: false
        type: string
      duration:
        description: 连续实播测试秒数（10-300）
        required: true
        default: "30"
        type: string

concurrency:
  group: live-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  huya-live-smoke:
    name: Huya + Douyu real FLV playback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: livetv-smoke:${{ github.sha }}
      HUYA_ROOM_ID: ${{ inputs.huya_room_id }}
      SMOKE_DURATION: ${{ inputs.duration }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runnable amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=verify-amd64

      - name: Start finished container
        run: |
          docker run -d --name livetv-smoke \
            -p 8081:8081 -p 19090:19090 \
            -e PUBLIC_HOST=127.0.0.1 \
            -e PUBLIC_PROXY_PORT=19090 \
            -e SYNC_HUYA_PAGES=1 \
            -e SYNC_HUYA_EXTRA_GAME_IDS= \
            -e SYNC_MIN_HUYA=1 \
            -e SYNC_DOUYU_PAGES=1 \
            -e SYNC_MIN_DOUYU=1 \
            "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8081/healthz >/dev/null; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' livetv-smoke | grep -qx true; then
              docker logs livetv-smoke
              exit 1
            fi
            sleep 2
          done
          echo "::error::成品容器在 60 秒内未就绪"
          docker logs livetv-smoke
          exit 1

      - name: Check effective image refresh defaults
        run: |
          docker exec livetv-smoke sh -ec '
            test "$HUYA_CACHE_TTL" = 30
            test "$DOUYU_CACHE_TTL" = 30
            test "$STREAM_READ_IDLE_SECONDS" = 10
            test "$SYNC_CHANNELS_MINUTES" = 15
            test "$IPTV_CHANNEL_SCOPE" = all
            test "$IPTV_VERIFY_STREAMS" = 1
            test "$IPTV_VERIFY_TIMEOUT" = 12
            test "$IPTV_VERIFY_WORKERS" = 6
            test "$IPTV_URLS_PER_CHANNEL" = 2
          '

      - name: Verify final IPTV playback gate
        run: |
          docker exec livetv-smoke sh -ec '
            mkdir -p /tmp/iptv-smoke
            ffmpeg -hide_banner -loglevel error \
              -f lavfi -i testsrc=size=160x90:rate=10 -t 2 \
              -c:v mpeg2video -f mpegts -y /tmp/iptv-smoke/live.ts
            cat > /tmp/iptv-smoke/input.m3u <<"EOF"
          #EXTM3U
          #EXTINF:-1 group-title="地方频道",广东珠江
          http://127.0.0.1:18080/live.ts
          #EXTINF:-1 group-title="地方频道",无效测试频道
          http://127.0.0.1:18080/missing.ts
          EOF
          '
          docker exec -d livetv-smoke sh -c \
            'cd /tmp/iptv-smoke && exec python3 -m http.server 18080'
          ready=0
          for attempt in $(seq 1 20); do
            if docker exec livetv-smoke curl -fsS --max-time 2 \
              http://127.0.0.1:18080/live.ts >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec livetv-smoke /opt/livetv/filter_iptv.py \
            --input /tmp/iptv-smoke/input.m3u \
            --output /tmp/iptv-smoke/output.m3u \
            --channel-scope all --verify-streams --verify-timeout 5 \
            --verify-workers 2 --urls-per-channel 2 --min-channels 1
          docker exec livetv-smoke grep -q 'live.ts' /tmp/iptv-smoke/output.m3u
          if docker exec livetv-smoke grep -q 'missing.ts' /tmp/iptv-smoke/output.m3u; then
            echo "::error::不可解码的 IPTV 地址进入了最终列表"
            exit 1
          fi

      - name: Probe real Huya and Douyu FLV streams
        run: |
          for platform in huya douyu; do
            args=(
              --platform "$platform"
              --playlist-url http://127.0.0.1:8081/allinone.m3u
              --proxy-url http://127.0.0.1:19090
              --duration "$SMOKE_DURATION"
              --min-bytes 1048576
              --max-gap 0.5
              --max-connect-seconds 10
              --candidates 5
              --playlist-wait 180
              --report "smoke-artifacts/${platform}-smoke-report.json"
            )
            if [[ "$platform" == huya && -n "$HUYA_ROOM_ID" ]]; then
              args+=(--room-id "$HUYA_ROOM_ID")
            fi
            python3 tests/live_stream_smoke.py "${args[@]}"
          done

      - name: Verify persistent channel logo cache
        shell: bash
        run: |
          playlist=$(curl -fsS http://127.0.0.1:8081/allinone.m3u)
          logo_url=$(PLAYLIST="$playlist" python3 -c 'import os,re; m=re.search(r"tvg-logo=\"([^\"]+/logo/[^\"]+)\"", os.environ["PLAYLIST"]); print(m.group(1) if m else "")')
          if [[ -z "$logo_url" ]]; then
            echo "::error::M3U 中没有本地频道头像地址"
            exit 1
          fi
          curl -fsS -D smoke-artifacts/logo-headers.txt -o smoke-artifacts/logo.img "$logo_url"
          test -s smoke-artifacts/logo.img
          grep -qi '^content-type: image/' smoke-artifacts/logo-headers.txt
          cached=$(docker exec livetv-smoke find /data/lnmp/allinone/logos -type f -size +0c | head -n 1)
          test -n "$cached"
          before=$(docker exec livetv-smoke stat -c '%Y:%s' "$cached")
          curl -fsS -o /dev/null "$logo_url"
          after=$(docker exec livetv-smoke stat -c '%Y:%s' "$cached")
          test "$before" = "$after"

      - name: Decode video and detect frozen or repeated frames
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          for platform in huya douyu; do
            mapfile -t room_ids < <(PLATFORM="$platform" python3 - <<'PY'
          import json, os
          from tests.live_stream_smoke import fetch_room_ids
          platform = os.environ["PLATFORM"]
          selected = json.load(open(f"smoke-artifacts/{platform}-smoke-report.json"))["selected_room_id"]
          rooms = fetch_room_ids("http://127.0.0.1:8081/allinone.m3u", 30, 5, platform)
          # 避免立刻对刚完成 60 秒测速的同一房间再次建连；平台可能短时限流。
          ordered = [room for room in rooms if room != selected][:2] + [selected]
          print("\n".join(dict.fromkeys(ordered)))
          PY
            )
            platform_passed=0
            for room_id in "${room_ids[@]}"; do
              stream_url="http://127.0.0.1:19090/stream/${platform}/${room_id}"
              frame_file="smoke-artifacts/${platform}-${room_id}-frames.md5"
              ffmpeg_log="smoke-artifacts/${platform}-${room_id}-ffmpeg.log"
              frame_report="smoke-artifacts/${platform}-${room_id}-frame-report.json"
              set +e
              timeout --signal=INT --kill-after=10s 90s \
                docker exec livetv-smoke ffmpeg \
                  -hide_banner -nostdin -loglevel warning -xerror \
                  -rw_timeout 10000000 \
                  -i "$stream_url" \
                  -t 60 -map 0:v:0 -an \
                  -vf 'scale=320:-2,fps=2' \
                  -f framemd5 - \
                  > "$frame_file" 2> "$ffmpeg_log"
              ffmpeg_rc=$?
              if [[ "$ffmpeg_rc" -eq 0 ]]; then
                python3 tests/analyze_framemd5.py \
                  --input "$frame_file" --report "$frame_report" \
                  --fps 2 --min-frames 60 --max-freeze-seconds 8 \
                  --max-loop-period-seconds 10 --min-loop-cycles 3 \
                  --min-loop-span-seconds 12
                analyze_rc=$?
              else
                analyze_rc=1
              fi
              set -e
              if [[ "$ffmpeg_rc" -eq 0 && "$analyze_rc" -eq 0 ]]; then
                platform_passed=1
                break
              fi
              echo "${platform} 房间 ${room_id} 解码/画面检测失败，尝试下一候选"
              tail -n 30 "$ffmpeg_log" || true
            done
            if [[ "$platform_passed" -ne 1 ]]; then
              echo "::error::${platform} 的候选房间均未通过 FFmpeg 解码和画面检测"
              exit 1
            fi
          done

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p smoke-artifacts
          docker logs livetv-smoke > smoke-artifacts/container.log 2>&1 || true
          for log in livetv sync-channels nginx huya-proxy; do
            docker cp "livetv-smoke:/data/lnmp/logs/${log}.log" \
              "smoke-artifacts/${log}.log" 2>/dev/null || true
          done
          grep -c 'reconnect#' smoke-artifacts/livetv.log \
            > smoke-artifacts/reconnect-count.txt 2>/dev/null || true
          find smoke-artifacts -maxdepth 1 -type f -print

      - name: Upload playback report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop container
        if: always()
        run: docker rm -f livetv-smoke >/dev/null 2>&1 || true
