name: Live Playback Smoke Test

on:
  workflow_dispatch:
    inputs:
      huya_room_id:
        description: 指定虎牙房间号；留空则从当前直播列表自动选择
        required: false
        type: string
      duration:
        description: 连续实播测试秒数（10-300）
        required: true
        default: "30"
        type: string

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  huya-live-smoke:
    name: Huya real FLV playback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: livetv-smoke:${{ github.sha }}
      HUYA_ROOM_ID: ${{ inputs.huya_room_id }}
      SMOKE_DURATION: ${{ inputs.duration }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runnable amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=verify-amd64

      - name: Start finished container
        run: |
          docker run -d --name livetv-smoke \
            -p 8081:8081 -p 19090:19090 \
            -e PUBLIC_HOST=127.0.0.1 \
            -e PUBLIC_PROXY_PORT=19090 \
            -e SYNC_HUYA_PAGES=1 \
            -e SYNC_MIN_HUYA=1 \
            "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8081/healthz >/dev/null; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' livetv-smoke | grep -qx true; then
              docker logs livetv-smoke
              exit 1
            fi
            sleep 2
          done
          echo "::error::成品容器在 60 秒内未就绪"
          docker logs livetv-smoke
          exit 1

      - name: Probe real Huya FLV stream
        run: |
          args=(
            --playlist-url http://127.0.0.1:8081/allinone.m3u
            --proxy-url http://127.0.0.1:19090
            --duration "$SMOKE_DURATION"
            --min-bytes 1048576
            --max-gap 0.5
            --candidates 5
            --playlist-wait 180
            --report smoke-artifacts/huya-smoke-report.json
          )
          if [[ -n "$HUYA_ROOM_ID" ]]; then
            args+=(--room-id "$HUYA_ROOM_ID")
          fi
          python3 tests/live_stream_smoke.py "${args[@]}"

      - name: Decode video and detect frozen or repeated frames
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          room_id=$(python3 -c 'import json; print(json.load(open("smoke-artifacts/huya-smoke-report.json"))["selected_room_id"])')
          stream_url="http://127.0.0.1:19090/stream/huya/${room_id}?fresh=1"
          set +e
          timeout --signal=INT --kill-after=10s 90s \
            docker exec livetv-smoke ffmpeg \
              -hide_banner -nostdin -loglevel warning -xerror \
              -rw_timeout 10000000 \
              -i "$stream_url" \
              -t 60 -map 0:v:0 -an \
              -vf 'scale=320:-2,fps=2' \
              -f framemd5 - \
              > smoke-artifacts/huya-frames.md5 \
              2> smoke-artifacts/huya-ffmpeg.log
          ffmpeg_rc=$?
          set -e
          if [[ "$ffmpeg_rc" -ne 0 ]]; then
            echo "::error::FFmpeg 实际解码失败，退出码 $ffmpeg_rc"
            tail -n 100 smoke-artifacts/huya-ffmpeg.log
            exit 1
          fi
          python3 tests/analyze_framemd5.py \
            --input smoke-artifacts/huya-frames.md5 \
            --report smoke-artifacts/huya-frame-report.json \
            --fps 2 \
            --min-frames 60 \
            --max-freeze-seconds 8 \
            --max-loop-period-seconds 10 \
            --min-loop-cycles 3 \
            --min-loop-span-seconds 12

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p smoke-artifacts
          docker logs livetv-smoke > smoke-artifacts/container.log 2>&1 || true
          for log in livetv sync-channels nginx huya-proxy; do
            docker cp "livetv-smoke:/data/lnmp/logs/${log}.log" \
              "smoke-artifacts/${log}.log" 2>/dev/null || true
          done
          grep -c 'reconnect#' smoke-artifacts/livetv.log \
            > smoke-artifacts/huya-reconnect-count.txt 2>/dev/null || true
          find smoke-artifacts -maxdepth 1 -type f -print

      - name: Upload playback report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huya-live-smoke-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop container
        if: always()
        run: docker rm -f livetv-smoke >/dev/null 2>&1 || true
