name: Build & Push Docker Images (Docker Hub + Aliyun)

# 触发: 推送代码 或 手动触发(重建)
on:
  push:
    # codex/** 用于在合并前验证重构分支；main 仍负责正式发布。
    branches: [main, "codex/**"]
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", "README.md", "dockerhub-description.md", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", "README.md", "dockerhub-description.md", ".github/workflows/build-image.yml"]
  workflow_dispatch:                 # GitHub 页面手动触发

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Go unit tests
        run: |
          go vet ./...
          go test ./...
      - name: Python syntax checks
        run: |
          python -m py_compile docker/*.py
          python -m unittest discover -s tests -v
      - name: Shell syntax checks
        run: |
          sh -n docker/*.sh docker/scripts/bridge_iptv.sh
          bash -n switch.sh docker/scripts/sync_iptv_from_nas.sh
          shellcheck -x docker/*.sh docker/scripts/*.sh switch.sh
      - name: Compose validation
        run: docker compose -f docker/docker-compose.yml config --quiet

  verify-image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache-scope: verify-amd64
          - platform: linux/arm64
            cache-scope: verify-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify ${{ matrix.platform }} image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  build:
    needs: verify-image
    # 审核分支只验证、不推镜像；仅 main 或手动运行允许发布。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    # 同时兼容仓库级 Secrets 和既有的 minshurui Environment Secrets。
    # Environment 中的同名 Secret 优先，凭证不会写入 workflow 或镜像。
    environment: minshurui
    permissions:
      contents: read
    env:
      # Docker Hub 命名空间默认与 GitHub 仓库 owner 相同；如不同可设置公开变量
      # vars.DOCKERHUB_USERNAME。用户名不是密钥，不再从 Secret 读取，避免错配。
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
      # 兼容原先使用账号密码的配置；推荐逐步迁移为 Docker Hub Access Token。
      DOCKERHUB_CREDENTIAL: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_REPO: ${{ secrets.ALIYUN_REPO }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

    # ⚠ 前置配置: GitHub 仓库 → Settings → Environments → minshurui 新增 Secrets。
    # 也可使用同名的 Repository Secrets；Environment 中的同名值优先。
    #   Docker Hub(必配, 缺失时发布 job 会明确失败):
    #     DOCKERHUB_PASSWORD = Docker Hub 登录密码（兼容原有配置）
    #     或 DOCKERHUB_TOKEN = Docker Hub Access Token（推荐，需具备 Read & Write）
    #   Docker Hub 用户名默认使用 github.repository_owner；命名空间不同时再配置
    #   Repository variable: DOCKERHUB_USERNAME = <Docker Hub ID>
    #   阿里云容器镜像 ACR(选配; 配了才推阿里云):
    #     ALIYUN_REGISTRY   = registry.cn-hangzhou.aliyuncs.com
    #     ALIYUN_NAMESPACE  = <你的命名空间>
    #     ALIYUN_REPO       = livetv-allinone
    #     ALIYUN_USERNAME   = <ACR 账号>
    #     ALIYUN_PASSWORD   = <ACR 密码>
    # 配好后点击 Actions 页右侧 "Run workflow" 手动触发, 或 push main 自动触发。

    steps:
      - name: Checkout livetv 仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate registry configuration
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_CREDENTIAL" ]]; then
            echo "::error::缺少 DOCKERHUB_PASSWORD 或 DOCKERHUB_TOKEN，无法发布 Docker Hub 镜像"
            exit 1
          fi
          aliyun_values=("$ALIYUN_REGISTRY" "$ALIYUN_NAMESPACE" "$ALIYUN_REPO" "$ALIYUN_USERNAME" "$ALIYUN_PASSWORD")
          aliyun_set=0
          for value in "${aliyun_values[@]}"; do
            [[ -n "$value" ]] && aliyun_set=$((aliyun_set + 1))
          done
          if [[ "$aliyun_set" -ne 0 && "$aliyun_set" -ne 5 ]]; then
            echo "::error::阿里云 ACR 配置不完整；请设置全部五项或全部留空"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ---- 登录 Docker Hub(已配才执行)----
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_CREDENTIAL != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_CREDENTIAL }}

      # ---- 登录阿里云 ACR(已配才执行)----
      - name: Login to Aliyun ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_USERNAME != '' && env.ALIYUN_PASSWORD != ''
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # ---- 单步按需双推: 应用多个 login 后, 分别推 Docker Hub 与阿里云 ----
      # 用两次 build-push-action(第二次只推阿里云 tag), 规避空 tag 污染

      - name: Build & push (Docker Hub)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_CREDENTIAL != ''
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone:latest
            ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_CREDENTIAL != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_CREDENTIAL }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone
          readme-filepath: ./dockerhub-description.md
          short-description: 直播源聚合、自愈、录播过滤，支持 amd64/arm64

      - name: Build & push (Aliyun ACR)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_NAMESPACE != '' && env.ALIYUN_REPO != '' && env.ALIYUN_USERNAME != '' && env.ALIYUN_PASSWORD != ''
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          # 复用 Docker Hub 步的构建缓存, 避免重复编译
          cache-from: type=gha
          cache-to: type=gha,mode=max
