name: Build & Push Docker Images (Docker Hub + Aliyun)

# 触发: 推送代码 或 手动触发(重建)
on:
  push:
    # codex/** 用于在合并前验证重构分支；main 仍负责正式发布。
    branches: [main, "codex/**"]
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", "README.md", "dockerhub-description.md", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", "README.md", "dockerhub-description.md", ".github/workflows/build-image.yml"]
  workflow_dispatch:                 # GitHub 页面手动触发

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Go unit tests
        run: |
          go vet ./...
          go test ./...
      - name: Python syntax checks
        run: |
          python -m py_compile docker/*.py
          python -m unittest discover -s tests -v
      - name: Shell syntax checks
        run: |
          sh -n docker/*.sh docker/scripts/bridge_iptv.sh
          bash -n switch.sh docker/scripts/sync_iptv_from_nas.sh
          shellcheck -x docker/*.sh docker/scripts/*.sh switch.sh
      - name: Compose validation
        run: docker compose -f docker/docker-compose.yml config --quiet

  verify-image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache-scope: verify-amd64
          - platform: linux/arm64
            cache-scope: verify-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify ${{ matrix.platform }} image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  publish-dockerhub:
    name: Publish Docker Hub
    needs: verify-image
    # 审核分支只验证、不推镜像；仅 main 的 push 或手动运行允许发布。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: minshurui
    permissions:
      contents: read
    env:
      # Docker Hub 命名空间默认与 GitHub 仓库 owner 相同；如不同可设置公开变量
      # vars.DOCKERHUB_USERNAME。用户名不是密钥，不再从 Secret 读取，避免错配。
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
      # 兼容原先使用账号密码的配置；推荐逐步迁移为 Docker Hub Access Token。
      DOCKERHUB_CREDENTIAL: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout livetv 仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Docker Hub configuration
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_CREDENTIAL" ]]; then
            echo "::error::缺少 DOCKERHUB_PASSWORD 或 DOCKERHUB_TOKEN，无法发布 Docker Hub 镜像"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_CREDENTIAL }}

      - name: Build & push (Docker Hub)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone:latest
            ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=verify-amd64
            type=gha,scope=verify-arm64
          cache-to: type=gha,mode=max,scope=publish-dockerhub

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_CREDENTIAL }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/livetv-allinone
          readme-filepath: ./dockerhub-description.md
          short-description: 直播源聚合、自愈、录播过滤，支持 amd64/arm64

  publish-aliyun:
    name: Publish Aliyun ACR
    needs: verify-image
    # 与 Docker Hub 独立发布，任一注册表失败都不会阻止另一端尝试推送。
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: minshurui
    permissions:
      contents: read
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_REPO: ${{ secrets.ALIYUN_REPO }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

    steps:
      - name: Validate Aliyun ACR configuration
        id: aliyun_config
        shell: bash
        run: |
          aliyun_values=("$ALIYUN_REGISTRY" "$ALIYUN_NAMESPACE" "$ALIYUN_REPO" "$ALIYUN_USERNAME" "$ALIYUN_PASSWORD")
          aliyun_set=0
          for value in "${aliyun_values[@]}"; do
            [[ -n "$value" ]] && aliyun_set=$((aliyun_set + 1))
          done
          if [[ "$aliyun_set" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "阿里云 ACR 未配置，跳过发布"
          elif [[ "$aliyun_set" -eq 5 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::阿里云 ACR 配置不完整；请设置全部五项或全部留空"
            exit 1
          fi

      - name: Checkout livetv 仓库
        if: steps.aliyun_config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        if: steps.aliyun_config.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: steps.aliyun_config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Aliyun ACR
        if: steps.aliyun_config.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Build & push (Aliyun ACR)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.aliyun_config.outputs.enabled == 'true'
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 部分阿里云 ACR 实例不接受 Buildx provenance/SBOM 的 OCI artifact manifest。
          # 关闭附件不影响 amd64/arm64 镜像及标准多架构 manifest。
          provenance: false
          sbom: false
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=verify-amd64
            type=gha,scope=verify-arm64
          cache-to: type=gha,mode=max,scope=publish-aliyun
