name: Build & Push Docker Images (Docker Hub + Aliyun)

# 触发: 推送代码 或 手动触发(重建)
on:
  push:
    # codex/** 用于在合并前验证重构分支；main 仍负责正式发布。
    branches: [main, "codex/**"]
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "*.go", "go.mod", ".github/workflows/build-image.yml"]
  workflow_dispatch:                 # GitHub 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Go unit tests
        run: go test ./...
      - name: Python syntax checks
        run: |
          python -m py_compile docker/*.py
          python -m unittest discover -s tests -v
      - name: Shell syntax checks
        run: |
          sh -n docker/entry.sh
          bash -n docker/scripts/*.sh

  verify-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Clone iptv-api build dependency
        run: git clone --depth 1 https://github.com/guovern/iptv-api.git src/iptv-api
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify amd64 and arm64 image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            BUILD_PROXY=

  build:
    needs: verify-image
    # 审核分支只验证、不推镜像；仅 main 或手动运行允许发布。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
      ALIYUN_REPO: ${{ secrets.ALIYUN_REPO }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

    # ⚠ 前置配置: GitHub 仓库 → Settings → Secrets and variables → Actions 新增:
    #   Docker Hub(必配, 否则跳过推送):
    #     DOCKERHUB_USERNAME = minshurui
    #     DOCKERHUB_TOKEN    = Docker Hub Access Token(https://hub.docker.com/settings/security)
    #   阿里云容器镜像 ACR(选配; 配了才推阿里云):
    #     ALIYUN_REGISTRY   = registry.cn-hangzhou.aliyuncs.com
    #     ALIYUN_NAMESPACE  = <你的命名空间>
    #     ALIYUN_REPO       = livetv-allinone
    #     ALIYUN_USERNAME   = <ACR 账号>
    #     ALIYUN_PASSWORD   = <ACR 密码>
    # 配好后点击 Actions 页右侧 "Run workflow" 手动触发, 或 push main 自动触发。

    steps:
      - name: Checkout livetv 仓库
        uses: actions/checkout@v4

      # 前置: clone iptv-api(构建必需, 已 .gitignore)
      - name: Clone iptv-api build dependency
        run: git clone --depth 1 https://github.com/guovern/iptv-api.git src/iptv-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ---- 登录 Docker Hub(已配才执行)----
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- 登录阿里云 ACR(已配才执行)----
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_USERNAME != '' && env.ALIYUN_PASSWORD != ''
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # ---- 单步按需双推: 应用多个 login 后, 分别推 Docker Hub 与阿里云 ----
      # 用两次 build-push-action(第二次只推阿里云 tag), 规避空 tag 污染

      - name: Build & push (Docker Hub)
        uses: docker/build-push-action@v6
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/livetv-allinone:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/livetv-allinone:${{ github.sha }}
          build-args: |
            BUILD_PROXY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push (Aliyun ACR)
        uses: docker/build-push-action@v6
        if: env.ALIYUN_REGISTRY != '' && env.ALIYUN_NAMESPACE != '' && env.ALIYUN_REPO != '' && env.ALIYUN_USERNAME != '' && env.ALIYUN_PASSWORD != ''
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:${{ github.sha }}
          build-args: |
            BUILD_PROXY=
          # 复用 Docker Hub 步的构建缓存, 避免重复编译
          cache-from: type=gha
          cache-to: type=gha,mode=max
