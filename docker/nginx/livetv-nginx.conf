# 自研反代 nginx 模板（由 entry.sh 渲染端口）。
worker_processes 1;
pid /run/livetv-nginx-master.pid;
error_log /var/log/nginx/livetv-error.log error;

events { worker_connections 1024; }

http {
    access_log /var/log/nginx/livetv-access.log;
    # 自研反代：8081 反代 /allinone.m3u → Go livetv(35455)
    server {
        listen ${LIVETV_HTTP_PORT};
        server_name _;
        absolute_redirect off;
        port_in_redirect off;

        location = /allinone.m3u {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store, must-revalidate";
            proxy_pass http://127.0.0.1:${AIO_PORT}/allinone.m3u;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
        location / {
            return 200 "livetv-allinone running. m3u 在 /allinone.m3u\n";
            add_header Content-Type text/plain;
        }
    }
}
