# livetv-allinone 一键部署
# 默认运行已发布镜像；本地构建使用 --build，不需要额外克隆依赖。
services:
  livetv:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${LIVETV_IMAGE:-minshurui/livetv-allinone:latest}
    container_name: livetv
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_AIO_PORT:-35455}:${AIO_PORT:-35455}"       # Go 解析/m3u
      - "${HOST_PROXY_PORT:-19090}:${PROXY_PORT:-19090}"   # Go 斗鱼 FLV
      - "${HOST_RES_PORT:-35456}:${RES_PORT:-35456}"       # Python 兼容解析
      - "${HOST_PY_PORT:-19091}:${PY_PORT:-19091}"         # Python 虎牙 FLV
      - "${HOST_LIVETV_PORT:-8081}:${LIVETV_HTTP_PORT:-8081}" # 播放列表入口
      - "${HOST_IPTV_UI_PORT:-8080}:${NGINX_HTTP_PORT:-8080}" # iptv-api UI
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      AIO_PORT: ${AIO_PORT:-35455}
      PROXY_PORT: ${PROXY_PORT:-19090}
      PY_PORT: ${PY_PORT:-19091}
      RES_PORT: ${RES_PORT:-35456}
      PUBLIC_AIO_PORT: ${HOST_AIO_PORT:-35455}
      PUBLIC_PROXY_PORT: ${HOST_PROXY_PORT:-19090}
      PUBLIC_PY_PORT: ${HOST_PY_PORT:-19091}
      PUBLIC_LIVETV_PORT: ${HOST_LIVETV_PORT:-8081}
      HUYA_CDN: ${HUYA_CDN:-AL}
      HUYA_CODEC: ${HUYA_CODEC:-264}
      HUYA_MAX_RATIO: ${HUYA_MAX_RATIO:-2000}
      HUYA_CACHE_TTL: ${HUYA_CACHE_TTL:-300}
      DOUYU_CACHE_TTL: ${DOUYU_CACHE_TTL:-300}
      PREWARM_PER_GROUP: ${PREWARM_PER_GROUP:-2}
      PREWARM_MAX_CHANNELS: ${PREWARM_MAX_CHANNELS:-16}
      PREWARM_WORKERS: ${PREWARM_WORKERS:-3}
      SYNC_HUYA_EXTRA_GAME_IDS: ${SYNC_HUYA_EXTRA_GAME_IDS:-2135}
      SYNC_HUYA_EXTRA_PAGES: ${SYNC_HUYA_EXTRA_PAGES:-0}
      SYNC_HUYA_WORKERS: ${SYNC_HUYA_WORKERS:-6}
      HUYA_GROUP_MODE: ${HUYA_GROUP_MODE:-compact}
      DOUYU_GROUP_MODE: ${DOUYU_GROUP_MODE:-compact}
      TZ: ${TZ:-Asia/Shanghai}
      APP_PORT: ${APP_PORT:-5180}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-8080}
      NGINX_RTMP_PORT: ${NGINX_RTMP_PORT:-1935}
      LIVETV_HTTP_PORT: ${LIVETV_HTTP_PORT:-8081}
      IPTV_MIN_CHANNELS: ${IPTV_MIN_CHANNELS:-20}
      IPTV_REJECT_VOD: ${IPTV_REJECT_VOD:-1}
      IPTV_BLOCKLIST: ${IPTV_BLOCKLIST:-}
      SYNC_MIN_HUYA: ${SYNC_MIN_HUYA:-20}
      SYNC_MIN_DOUYU: ${SYNC_MIN_DOUYU:-20}
    volumes:
      - ${LIVETV_DATA_DIR:-../data}:/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
