# livetv-allinone 一键部署
# 构建: (前提 WSL Ubuntu 已 clone src/iptv-api)
#   git clone --depth 1 https://github.com/guovern/iptv-api.git src/iptv-api
#   docker compose -f docker/docker-compose.yml up -d --build
version: "3.8"
services:
  livetv:
    build:
      context: ..
      dockerfile: Dockerfile
    image: minshurui/livetv-allinone:latest
    container_name: livetv
    restart: unless-stopped
    ports:
      - "35455:35455"   # Go 解析/m3u
      - "19090:19090"   # Go 斗鱼 FLV
      - "35456:35456"   # Python 虎牙 301 解析
      - "19091:19091"   # Python 虎牙 FLV 直通
      - "8081:8081"     # nginx 反代 allinone.m3u
      - "8080:8080"     # iptv-api Web UI
    environment:
      - PUBLIC_HOST=
      - AIO_PORT=35455
      - PROXY_PORT=19090
      - PY_PORT=19091
      - RES_PORT=35456
      - TZ=Asia/Shanghai
      - APP_PORT=5180
      - NGINX_HTTP_PORT=8080
      - NGINX_RTMP_PORT=1935
    volumes:
      - ../data:/data   # 数据持久化 (从仓库根 data/)
